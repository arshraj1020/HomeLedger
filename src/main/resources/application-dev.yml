# Local development only.
#
# This profile does exactly one thing: create a household and an ADMIN member
# at startup (DevelopmentAdminBootstrap), because there is no registration
# endpoint. It changes two local ergonomics settings alongside that, and
# nothing else.
#
# Never activate 'dev' in a deployed environment. The default profile has no
# bootstrap of any kind, which is the whole point of keeping this separate.
#
# It deliberately defines NO credentials — not the database password, not the
# JWT signing key. An earlier version defaulted the database password to match
# docker-compose.yml, which was worse than useless: once .env sets a real
# password, a default here silently disagrees with it and `mvn spring-boot:run`
# fails to authenticate for reasons that point nowhere near the cause. One
# source of truth instead — the same .env that Compose reads:
#
#   cp .env.example .env          # fill in DB_PASSWORD, JWT_SECRET, DEV_ADMIN_*
#   set -a; source .env; set +a
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev

spring:
  thymeleaf:
    # Template edits show up on reload without restarting. Production keeps
    # the cache on (application.yml).
    cache: false

server:
  servlet:
    session:
      cookie:
        # Local development is plain HTTP, and a Secure cookie would simply be
        # dropped by the browser, producing a login page that never logs in.
        secure: false

bootstrap:
  dev-admin:
    household-name: ${DEV_HOUSEHOLD_NAME:Development Household}
    member-name: ${DEV_ADMIN_NAME:Development Admin}
    # No defaults, on purpose — see DevelopmentAdminProperties.
    email: ${DEV_ADMIN_EMAIL:}
    password: ${DEV_ADMIN_PASSWORD:}

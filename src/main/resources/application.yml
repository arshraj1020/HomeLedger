spring:
  application:
    name: household-ledger

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:household_ledger}
    username: ${DB_USER:household_ledger}
    password: ${DB_PASSWORD:household_ledger}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    # Cached by default, because Phase 7 gives the application real templates
    # and an uncached engine re-parses every one of them on every request —
    # straight into the PRD §5 p95 target. Set THYMELEAF_CACHE=false while
    # working on the UI to see edits without a restart.
    cache: ${THYMELEAF_CACHE:true}

security:
  jwt:
    # PRD §5: "No plaintext secrets in repo; JWT secret via env var."
    # The fallback is a clearly-labelled local development placeholder, not a
    # secret: it exists so `docker compose up` works out of the box. Any real
    # deployment MUST set JWT_SECRET. JwtProperties.validate() rejects a
    # secret shorter than 32 bytes at startup rather than issuing weakly
    # signed tokens.
    secret: ${JWT_SECRET:local-development-only-not-a-secret-replace-via-JWT_SECRET-env-var}
    # PRD §FR-1: 15-minute access token, 7-day rotating refresh token.
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8080}
  error:
    # These are Boot's defaults, stated explicitly because the browser error
    # page renders whatever is in the error model. PRD §9 requires that
    # implementation details, stack traces and SQL never reach a client, and a
    # future "just for debugging" flip of one of these would leak all three
    # into a page rather than into a log.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  level:
    com.householdledger: INFO
